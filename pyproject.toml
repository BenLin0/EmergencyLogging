[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-logging"
version = "0.4"
description = "A Python logging handler that buffers records silently and flushes them when a configurable trigger level is reached"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["logging", "handler", "debug", "buffer", "incident"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
]

[tool.setuptools]
py-modules = ["incident_logging"]

[project.urls]
Homepage = "https://github.com/BenLin0/EmergencyLogging"
